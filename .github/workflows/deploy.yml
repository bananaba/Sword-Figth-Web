name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @vibejam/shared build
      - run: yarn workspace @vibejam/worker test
      - run: yarn workspace @vibejam/client typecheck

  deploy-worker:
    name: Deploy Cloudflare Worker
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @vibejam/shared build
      - run: yarn workspace @vibejam/worker build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.114.17"
          workingDirectory: worker
          command: deploy

  deploy-pages:
    name: Deploy Cloudflare Pages
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @vibejam/shared build
      - run: yarn workspace @vibejam/client build
      - name: Extract commit subject
        id: commit_meta
        run: |
          subject=$(git log -1 --pretty=%s | tr -d '"`$\\' | head -c 200)
          echo "subject=${subject}" >> "$GITHUB_OUTPUT"
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.114.17"
          command: pages deploy client/dist --project-name=chambara-duel --branch=main --commit-dirty=true --commit-hash=${{ github.sha }} --commit-message="${{ steps.commit_meta.outputs.subject }}"
